# Base configuration = the original architecture/training spec.
# Dataset configs (nslkdd.yaml, cicids2017.yaml) are layered on top of this.

name: dummy
dataset: dummy                     # "dummy" (synthetic) or "csv"
processed_path: data/processed/dummy.npz

# --- Split ---
test_size: 0.2                     # used only when split == random

# --- Features ---
k_features: 10                     # SelectKBest(mutual_info_classif)

# --- Model (CNN -> LSTM -> Dense) ---
conv_filters: 64
conv_kernel: 1
pool_size: 2
lstm_units: 64
dense_units: 32
dropout: 0.3

# --- Training ---
batch_size: 32
epochs: 10
lr: 0.001                          # Adam

seed: 42
runs_dir: runs